name: Release

# Push a tag like v1.1.0 to build the app for Windows, macOS, and Linux and attach the archives
# to the GitHub release. Run it manually to build and test without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            arch: x64
            build: dist/Downloader-win32-x64
            exe: Downloader.exe
            app: resources/app
            smoke: true
          - name: macOS arm64
            os: macos-latest
            arch: arm64
            build: dist/Downloader-darwin-arm64
            exe: Downloader.app/Contents/MacOS/Downloader
            app: Downloader.app/Contents/Resources/app
            smoke: true
          - name: macOS x64
            os: macos-latest
            arch: x64
            build: dist/Downloader-darwin-x64
            exe: Downloader.app/Contents/MacOS/Downloader
            app: Downloader.app/Contents/Resources/app
            smoke: false
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            build: dist/Downloader-linux-x64
            exe: Downloader
            app: resources/app
            smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/package.js --zip --arch=${{ matrix.arch }}

      - name: Install ffmpeg for the smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      # Runs the bundled server with the packaged app's own Node.js and checks that the
      # platform's yt-dlp build was downloaded and starts.
      - name: Smoke test the server
        if: matrix.smoke
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
          HOST: 127.0.0.1
          PORT: '3299'
          DOWNLOADER_DATA_DIR: ${{ runner.temp }}/downloader-data
        run: |
          "${{ matrix.build }}/${{ matrix.exe }}" "${{ matrix.build }}/${{ matrix.app }}/server.js" > server.log 2>&1 &
          trap "kill $! 2>/dev/null || true" EXIT
          for i in $(seq 1 60); do
            health=$(curl -s --max-time 90 http://127.0.0.1:3299/api/health || true)
            if echo "$health" | grep -q '"status":"ready"'; then break; fi
            sleep 2
          done
          cat server.log
          echo "$health"
          echo "$health" | grep -q '"status":"ready"'
          if [ "$RUNNER_OS" = "Linux" ]; then echo "$health" | grep -q '"ffmpegFound":true'; fi

      # Starts the whole desktop app on a virtual display; it must still be running after 20 seconds.
      - name: Smoke test the desktop app
        if: runner.os == 'Linux'
        run: |
          set +e
          xvfb-run -a timeout 20 "${{ matrix.build }}/${{ matrix.exe }}" --hidden --no-sandbox
          code=$?
          echo "exit code $code (124 means it was still running)"
          test $code -eq 124

      - uses: actions/upload-artifact@v4
        with:
          name: downloader-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Downloader $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* -R "$GITHUB_REPOSITORY" --clobber
