<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="color-scheme" content="light dark" />
    <title>Downloader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3.5v11m0 0-4.5-4.5M12 14.5l4.5-4.5M5 19.5h14" /></svg>
          </span>
          <div>
            <h1 class="brand-title">Downloader</h1>
            <p class="intro">Paste a link and save it as MP4, MP3, or WAV.</p>
          </div>
        </header>

        <form id="download-form" class="form">
          <input
            id="url-input"
            name="url"
            type="url"
            placeholder="https://..."
            autocomplete="off"
            required
          />

          <div class="preset-group" aria-label="Format">
            <button type="button" class="preset-button active" data-preset="mp4">
              <span class="preset-name">MP4</span><span class="preset-hint">Video</span>
            </button>
            <button type="button" class="preset-button" data-preset="mp3">
              <span class="preset-name">MP3</span><span class="preset-hint">Audio</span>
            </button>
            <button type="button" class="preset-button" data-preset="wav">
              <span class="preset-name">WAV</span><span class="preset-hint">Uncompressed</span>
            </button>
          </div>

          <div class="actions">
            <button id="preview-button" type="button">Preview</button>
            <button id="download-button" type="submit" class="primary">Download</button>
          </div>
        </form>

        <section class="meta">
          <p id="meta-title" class="meta-title">No preview yet.</p>
          <p id="meta-text" class="meta-text">Paste a direct video or audio URL.</p>
        </section>

        <section id="status" class="status" data-state="idle">
          <div class="status-row">
            <span>Status</span>
            <span id="job-status" class="status-text">Ready</span>
          </div>

          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>

          <div class="metrics">
            <span id="metric-progress">0%</span>
            <span id="metric-speed">-</span>
            <span id="metric-size">-</span>
            <span id="metric-eta">-</span>
          </div>
        </section>

        <a id="result-link" class="result-link hidden" href="#" download>Open file</a>

        <div id="result-actions" class="result-actions hidden">
          <p id="result-name" class="result-name"></p>
          <button id="result-show" type="button">Show in folder</button>
        </div>

        <footer id="folders" class="folders hidden" aria-label="Save folders">
          <button type="button" class="folder-button" data-kind="video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" /></svg>
            <span>MP4</span>
          </button>
          <button type="button" class="folder-button" data-kind="audio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" /></svg>
            <span>MP3</span>
          </button>
        </footer>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
